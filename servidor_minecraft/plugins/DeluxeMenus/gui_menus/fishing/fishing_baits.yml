    update: true
    display_name: '&#9a17ec&lꜰʀᴀɢᴍᴇɴᴛᴏ ᴀʙɪꜱᴀʟ'
    lore:
      - '&7&oꜱᴀᴄᴀᴅᴏ ᴅᴇ ᴜɴᴀ ɢʀɪᴇᴛᴀ ᴘʀᴏꜰᴜɴᴅᴀ ᴅᴇʟ ᴍᴀʀ.'
      - '&7&oᴠɪʙʀᴀ ᴄᴏɴ ᴜɴᴀ ꜰʀᴇᴄᴜᴇɴᴄɪᴀ ᴅᴇ ᴏᴛʀᴏ ᴍᴜɴᴅᴏ'
      - '&7&oǫᴜᴇ ʀᴇꜱᴜᴇɴᴀ ᴄᴏɴ ꜱᴇʀᴇꜱ ᴘᴏᴅᴇʀᴏꜱᴏꜱ.'
      - '&7'
      - '&#9a17ec♦ &fᴀᴛʀᴀᴇ &#9a17ecᴘᴇᴄᴇꜱ éᴘɪᴄᴏꜱ'
      - '&#9a17ec♦ &fᴘʀᴇᴄɪᴏ: &2$&a40'
      - '&7'
      - '&f &eᴄʟɪᴄ ᴘᴀʀᴀ ᴄᴏᴍᴘʀᴀʀ'
    click_requirement:
      requirements:
        money:
          type: javascript
          expression: '%vault_eco_balance% >= 40'
          deny_commands:
            - "[message] &f &cʏᴏᴜ ᴅᴏɴ'ᴛ ʜᴀᴠᴇ ᴇɴᴏᴜɢʜ ᴍᴏɴᴇʏ ᴛᴏ ᴘᴜʀᴄʜᴀꜱᴇ ᴛʜɪꜱ!"
            - "[close]"
