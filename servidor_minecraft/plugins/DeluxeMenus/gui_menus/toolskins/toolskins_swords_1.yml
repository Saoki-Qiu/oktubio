      - HIDE_ENCHANTS 
    update: true
    display_name: '&b&lꜰʟᴏʀᴀʟ ꜱᴋɪɴ'
    lore:
      - '&7ꜱᴏꜱᴛéɴ ᴜɴᴀ ᴇꜱᴘᴀᴅᴀ ᴅᴇ ɴᴇᴛʜᴇʀɪᴛᴀ ᴇɴ'
      - '&7ᴛᴜ ᴍᴀɴᴏ ᴘᴀʀᴀ ᴀᴘʟɪᴄᴀʀ ʟᴀ ꜱᴋɪɴ'
      - ''
      - '&8▪ &fᴀᴘʟɪᴄᴀᴅᴏ ᴇɴ: &eᴇꜱᴘᴀᴅᴀ ᴅᴇ ɴᴇᴛʜᴇʀɪᴛᴀ'
      - '&8▪ &fᴘʀᴇᴄɪᴏ: &6800&f'
      - ''
      - '&f &eᴄʟɪᴄ ᴘᴀʀᴀ ᴀᴘʟɪᴄᴀʀ'
    click_requirement:
      requirements:
        check:
          type: string equals ignorecase
          input: "%player_item_in_hand%"
          output: "NETHERITE_SWORD"
          deny_commands:
            - "[message] &f &cʏᴏᴜ ᴀʀᴇ ɴᴏᴛ ʜᴏʟᴅɪɴɢ ᴀɴ ɴᴇᴛʜᴇʀɪᴛᴇ ꜱᴡᴏʀᴅ!"  
    view_requirement:
      requirements:
        permission:
          type: "has permission"
          permission: rskin.change.sword.floral
    click_commands:
      - "[player] rskin apply sword_floral"
      - "[close]"
