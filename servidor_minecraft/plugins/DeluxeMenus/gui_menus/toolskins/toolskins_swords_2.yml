#ToolSkins


  'toolskins_toggle_1':
    material: NETHERITE_SWORD
    model_data: 5
    amount: 1
    slot: 11
    priority: 1
    item_flags:
      - HIDE_ATTRIBUTES
      - HIDE_ENCHANTS 
    update: true
    display_name: '&b&lʙʟᴀᴢᴇ ꜱᴋɪɴ'
    lore:
      - '&7ꜱᴏꜱᴛéɴ ᴜɴᴀ ᴇꜱᴘᴀᴅᴀ ᴅᴇ ɴᴇᴛʜᴇʀɪᴛᴀ ᴇɴ'
      - '&7ᴛᴜ ᴍᴀɴᴏ ᴘᴀʀᴀ ᴀᴘʟɪᴄᴀʀ ʟᴀ ꜱᴋɪɴ'
      - ''
      - '&8▪ &fᴀᴘʟɪᴄᴀᴅᴏ ᴇɴ: &eᴇꜱᴘᴀᴅᴀ ᴅᴇ ɴᴇᴛʜᴇʀɪᴛᴀ'
      - '&8▪ &fᴘʀᴇᴄɪᴏ: &2$&a73,200'
      - ''
      - '&f &eᴄʟɪᴄ ᴘᴀʀᴀ ᴀᴘʟɪᴄᴀʀ'
    click_requirement:
      requirements:
        check:
          type: string equals ignorecase
          input: "%player_item_in_hand%"
          output: "NETHERITE_SWORD"
          deny_commands:
            - "[message] &f &cʏᴏᴜ ᴀʀᴇ ɴᴏᴛ ʜᴏʟᴅɪɴɢ ᴀɴ ɴᴇᴛʜᴇʀɪᴛᴇ ꜱᴡᴏʀᴅ!"  
    view_requirement:
      requirements:
        permission:
          type: "has permission"
          permission: rskin.change.sword.blaze
    click_commands:
      - "[player] rskin apply sword_blaze"
      - "[close]"
  'toolskins_purchase_1':
    material: NETHERITE_SWORD
    model_data: 5
